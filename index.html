<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Independent software to organise your Australian visa documents. Not affiliated with the Australian Government. Not a migration agent.">
<title>VisaFly — Your Australian visa paperwork, finally under control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#F1ECE1; --surface:#FBF8F1; --surface-2:#E8E1D2; --ink:#13233A; --ink-2:#4F5B6C; --line:#DAD1BF;
  --euc:#3D6B5B; --euc-ink:#FFFFFF; --euc-soft:#DCE7DF; --gold:#A9832F; --gold-soft:#F2E6C6;
  --red:#A6412E; --red-soft:#F3DCD3; --muted:#C9BFAC; --navy:#13233A; --navy-2:#1D3352; --on-navy:#F1ECE1; --on-navy-2:#A9B6C7;
  --cjk:"PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC","Microsoft YaHei","Malgun Gothic";
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",var(--cjk),sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",var(--cjk),sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
:root[lang="zh-Hant-HK"]{--cjk:"PingFang HK","PingFang TC","Noto Sans CJK TC","Microsoft JhengHei"}
:root[lang="ja"]{--cjk:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Meiryo"}
:root[lang="ko"]{--cjk:"Apple SD Gothic Neo","Noto Sans CJK KR","Malgun Gothic"}
:root:is([lang^="zh"],[lang="ja"],[lang="ko"]) :is(h1,h2,h3){letter-spacing:0;line-height:1.2}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1726; --surface:#132136; --surface-2:#1B2C46; --ink:#EEE9DF; --ink-2:#A8B3C2; --line:#27395A;
    --euc:#7DB19C; --euc-ink:#0D1726; --euc-soft:#1B3A34; --gold:#D8B25A; --gold-soft:#3A3220;
    --red:#E2876F; --red-soft:#3D2420; --muted:#3A4C68; --navy:#0A1320; --navy-2:#16263D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1726; --surface:#132136; --surface-2:#1B2C46; --ink:#EEE9DF; --ink-2:#A8B3C2; --line:#27395A;
  --euc:#7DB19C; --euc-ink:#0D1726; --euc-soft:#1B3A34; --gold:#D8B25A; --gold-soft:#3A3220;
  --red:#E2876F; --red-soft:#3D2420; --muted:#3A4C68; --navy:#0A1320; --navy-2:#16263D; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--euc);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;letter-spacing:-.02em;font-weight:650}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font-weight:600;min-height:48px;text-decoration:none;transition:transform .12s ease,background .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--euc);color:var(--euc-ink)}
.btn-dark{background:var(--navy);color:var(--on-navy)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-gold{background:var(--gold);color:#1A1407}
.btn-danger{background:var(--red);color:#fff}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:8px 14px;border-radius:11px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.linkbtn{background:none;border:0;padding:0;color:var(--euc);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Landing */
.land{max-width:1160px;margin:0 auto;padding:16px 20px 72px}
.land-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 22px;position:relative;z-index:2}
.land-nav .links{display:none;gap:22px;font-weight:600}
.land-nav .links a{color:var(--ink-2);text-decoration:none}
@media(min-width:900px){.land-nav .links{display:flex}}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",var(--body);font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.logo svg{width:30px;height:30px}
.hero{display:grid;gap:34px;align-items:center;padding:8px 0 56px}
@media(min-width:960px){.hero{grid-template-columns:1.05fr .95fr;gap:48px;padding:30px 0 80px}}
.hero h1{font-size:clamp(44px,8.6vw,88px);font-weight:800;letter-spacing:-.045em;line-height:.96}
.hero h1 span{display:block;color:var(--ink-2);font-weight:650}
.hero p.lede{font-size:clamp(18px,2.3vw,21px);color:var(--ink-2);max-width:36ch;margin:22px 0 28px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px}
.trustline{display:flex;gap:10px;align-items:flex-start;margin-top:22px;font-size:14px;color:var(--ink-2);max-width:48ch}
.trustline svg{flex:none;margin-top:2px}
.stage{position:relative;border-radius:30px;overflow:hidden;background:var(--navy);min-height:460px;box-shadow:0 40px 80px -40px rgba(19,35,58,.6)}
.stage > svg{position:absolute;inset:0;width:100%;height:100%}
.phone{position:relative;margin:38px auto 0;width:min(282px,78%);border-radius:36px;background:#0B1422;padding:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.phone .scr{background:#F1ECE1;border-radius:28px;padding:18px 14px 16px;color:#13233A;font-size:12.5px}
.phone .scr h4{margin:0 0 10px;font-family:"Bricolage Grotesque",var(--body);font-size:19px;letter-spacing:-.02em}
.phone .mini{background:#13233A;color:#F1ECE1;border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px}
.phone .mini b{font-family:"Bricolage Grotesque",var(--body);font-size:26px}
.phone .r{display:flex;align-items:center;gap:8px;background:#FBF8F1;border:1px solid #DAD1BF;border-radius:12px;padding:8px 10px;margin-top:7px}
.phone .r img{width:26px;height:34px;object-fit:cover;border-radius:4px;border:1px solid #DAD1BF}
.floatcard{position:absolute;background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:600;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);display:flex;gap:8px;align-items:center}
.fc1{left:18px;top:18px}.fc2{right:14px;bottom:22px}
@media(max-width:480px){.fc1{left:10px;top:10px;font-size:12px}.fc2{right:10px;bottom:12px;font-size:12px}}
.band{display:grid;gap:18px;margin:4px 0 72px}
@media(min-width:760px){.band{grid-template-columns:repeat(3,1fr)}}
.band div{border-top:2px solid var(--ink);padding-top:16px}
.band h3{font-size:28px;margin-bottom:8px;font-weight:800}
.band p{margin:0;color:var(--ink-2)}
.section{margin:0 0 80px}
.section > h2{font-size:clamp(32px,5vw,54px);max-width:20ch;margin-bottom:14px;font-weight:800;letter-spacing:-.035em}
.section > p{color:var(--ink-2);max-width:62ch;margin:0 0 28px;font-size:18px}
.steps{display:grid;gap:14px;padding:0;margin:0}
@media(min-width:760px){.steps{grid-template-columns:repeat(4,1fr)}}
.steps li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.steps .spot{width:100%;height:110px;border-radius:16px;background:var(--euc-soft);margin-bottom:14px;display:grid;place-items:center}
.steps .spot svg{width:120px;height:90px}
.steps .n{font-family:"Bricolage Grotesque",var(--body);font-weight:800;color:var(--euc);font-size:14px}
.steps strong{display:block;font-family:var(--display);font-size:20px;margin:2px 0 4px}
.steps span{color:var(--ink-2);font-size:15px}
.split{display:grid;gap:16px}
@media(min-width:900px){.split{grid-template-columns:1fr 1fr;align-items:stretch}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.panel h3{font-size:22px;margin-bottom:10px;font-weight:800}
.panel ul{margin:0;padding-left:20px;color:var(--ink-2)}
.panel li{margin:6px 0}
.trustgrid{display:grid;gap:14px}
@media(min-width:760px){.trustgrid{grid-template-columns:1fr 1fr}}
.prices{display:grid;gap:14px}
@media(min-width:900px){.prices{grid-template-columns:repeat(4,1fr)}}
.price{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px;position:relative}
.price.feature{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.price.feature .pm{color:var(--on-navy-2)}
.price .flag{position:absolute;top:-12px;left:22px;background:var(--gold);color:#1A1407;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.price h3{font-size:20px}
.price .amt{font-family:"Bricolage Grotesque",var(--body);font-size:42px;font-weight:800;letter-spacing:-.03em}
.price .pm{color:var(--ink-2);font-size:14px}
.price ul{padding-left:18px;margin:6px 0 12px;font-size:15px;flex:1}
.agentband{display:grid;gap:24px;align-items:center;background:var(--navy);color:var(--on-navy);border-radius:30px;padding:28px}
.agentband h2{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.agentband p{color:var(--on-navy-2);margin:0 0 18px;font-size:17px}
@media(min-width:900px){.agentband{grid-template-columns:1fr 1fr;padding:44px}}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--euc)}
.faq details[open] summary::after{content:"\2212"}
.faq p{color:var(--ink-2);margin:10px 0 0;max-width:70ch}
.footer{border-top:1px solid var(--line);padding-top:24px;color:var(--ink-2);font-size:14px;display:grid;gap:12px}
.footer nav{display:flex;flex-wrap:wrap;gap:16px}
.footer nav a{color:var(--ink-2)}

/* App shell */
.app{min-height:100%}
.side{display:none}
.main{padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:900px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:48px}
.iconbtn{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;gap:6px;grid-auto-flow:column}
.iconbtn svg{width:20px;height:20px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px env(safe-area-inset-bottom,0px)}
.bnav a span{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;color:var(--ink-2);text-decoration:none;font-size:11.5px;font-weight:600;border-radius:12px;text-align:center}
.bnav a[aria-current="page"]{color:var(--euc)}
.bnav svg{width:24px;height:24px}
@media(min-width:960px){
  .app{display:grid;grid-template-columns:264px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
  .side a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600}
  .side a.nav[aria-current="page"]{background:var(--euc-soft);color:var(--euc)}
  .side a.nav svg{width:22px;height:22px;flex:none}
  .side .sep{height:1px;background:var(--line);margin:10px 4px}
  .side .spacer{flex:1}
  .bnav{display:none}
  .main{padding:28px 44px 64px}
  .topbar .logo{visibility:hidden}
}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.notice svg{flex:none;margin-top:1px}

/* Dashboard */
.greet{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.035em;margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.chip{min-height:38px}
.plan{background:var(--navy);color:var(--on-navy);border-radius:28px;padding:22px;display:grid;gap:18px;position:relative;overflow:hidden}
.plan > svg.bgleaf{position:absolute;right:-24px;bottom:-36px;width:170px;height:170px;opacity:.1;pointer-events:none}
.plan-top{display:flex;gap:18px;align-items:center;position:relative}
.ringwrap{position:relative;width:148px;height:148px;flex:none}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringwrap .num b{font-family:"Bricolage Grotesque",var(--body);font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ringwrap .num small{display:block;font-size:12px;color:var(--on-navy-2);margin-top:4px}
.plan h2{font-size:24px;font-weight:800}
.plan .sub{color:var(--on-navy-2);font-size:14.5px;margin-top:6px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.legend button,.legend div{display:flex;align-items:center;gap:10px;background:var(--navy-2);border:0;border-radius:14px;padding:10px 12px;color:var(--on-navy);text-align:left;font-size:14.5px}
.legend b{font-family:"Bricolage Grotesque",var(--body);font-size:22px;margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.d-ready{background:var(--euc)} .d-attention{background:var(--gold)} .d-missing{background:var(--red)} .d-todo{background:var(--muted)} .d-na{background:transparent;border:2px solid var(--muted)} .d-after{background:transparent;border:2px dashed var(--muted)}
.plan .d-todo,.stage .d-todo{background:#5D6F8A}
.plan .btn-primary{background:#7DB19C;color:#0D1726}
@media(min-width:680px){.plan{grid-template-columns:1fr 1fr;align-items:center;padding:28px}.plan .cta{grid-column:1/-1}}
.gapsbtn{display:flex;align-items:center;gap:14px;width:100%;margin:14px 0 8px;padding:18px 20px;border-radius:22px;border:2px solid var(--ink);background:var(--surface);text-align:left}
.gapsbtn strong{font-family:var(--display);font-size:22px;display:block}
.gapsbtn span{color:var(--ink-2);font-size:14.5px}
.gapsbtn svg{flex:none;width:34px;height:34px}
.h-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px}
.h-row h2{font-size:22px;font-weight:800}
.h-row a,.h-row button{font-size:14px;font-weight:600}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;color:var(--ink);text-decoration:none}
.row .t{font-weight:600;display:block}
.row .s{font-size:14px;color:var(--ink-2);display:block}
.row .grow{flex:1;min-width:0}
.row .end{color:var(--ink-2);flex:none}
.alert{border-left:4px solid var(--gold)}
.alert.red{border-left-color:var(--red)}
.alert.blue{border-left-color:var(--euc)}
.people{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.person{display:flex;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",var(--body);font-weight:800;background:var(--euc-soft);color:var(--euc);flex:none}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--euc);border-radius:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:6px}
.tile strong{font-family:var(--display);font-size:18px}
.tile span{font-size:13.5px;color:var(--ink-2)}
.tile svg{width:26px;height:26px;color:var(--euc)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.strip .thumbcard{flex:0 0 132px}
.upnext{display:grid;gap:8px}
.upnext .row .when{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* Checklist */
.pagehead h1{font-size:clamp(32px,6vw,46px);font-weight:800;letter-spacing:-.035em}
.pagehead p{color:var(--ink-2);margin:6px 0 16px;max-width:64ch}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 6px;margin:0 -16px 10px;scrollbar-width:none}
.group{margin:24px 0 0}
.group-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.group-h h2{font-size:24px;font-weight:800}
.group-h .plain{display:block;color:var(--ink-2);font-size:14px;font-family:var(--body);font-weight:500;letter-spacing:0;margin-top:3px}
.group-h .gp{min-width:92px;text-align:right;color:var(--ink-2);font-size:13px;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.st{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st-ready{background:var(--euc-soft);color:var(--euc)} .st-attention{background:var(--gold-soft);color:var(--gold)} .st-missing{background:var(--red-soft);color:var(--red)} .st-todo{background:var(--surface-2);color:var(--ink-2)} .st-na,.st-after{background:transparent;border:1px solid var(--line);color:var(--ink-2)}

/* Documents */
.drop{display:grid;place-items:center;text-align:center;gap:8px;padding:18px 16px;border:2px dashed var(--line);border-radius:22px;background:var(--surface);margin-bottom:18px}
.drop.over{border-color:var(--euc);background:var(--euc-soft)}
.drop strong{font-family:var(--display);font-size:22px}
.drop p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:52ch}
.drop .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1200px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.thumbcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;color:var(--ink)}
.thumbcard .pic{aspect-ratio:3/4;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.thumbcard .pic img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumbcard .pic .ext{font-weight:800;color:var(--ink-2);font-size:14px}
.thumbcard .pic .st{position:absolute;left:8px;bottom:8px}
.thumbcard .meta{padding:10px 12px 12px;min-width:0}
.thumbcard .meta b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbcard .meta span{display:block;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficon{width:42px;height:52px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--ink-2);flex:none;overflow:hidden;border:1px solid var(--line)}
.ficon img{width:100%;height:100%;object-fit:cover;object-position:top}
.preview{width:100%;max-height:380px;object-fit:contain;background:var(--surface-2);border-radius:16px;border:1px solid var(--line);display:block;margin:4px 0 8px}
.health{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.health li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.ok{color:var(--euc)} .warn{color:var(--gold)} .bad{color:var(--red)}

/* Evidence map */
.map{display:grid;gap:12px}
.mrow{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.mnode{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:14.5px;min-width:0}
.mnode.req{font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink-2)}
.mnode.file{background:var(--surface-2)}
.mnode.gap{border:1.5px dashed var(--red);color:var(--red)}
.mnode.per .avatar{width:28px;height:28px;font-size:13px}
.mlink{width:2px;height:10px;background:var(--line);margin-left:22px}
@media(min-width:1100px){.mrow{grid-template-columns:.8fr 18px 1.1fr 18px 1.5fr 18px 1fr;align-items:center}.mlink{width:100%;height:2px;margin:0}}

/* Timeline */
.tl{position:relative;margin:10px 0 0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 18px 46px}
.tl .knob{position:absolute;left:6px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--muted)}
.tl li.now .knob{border-color:var(--euc);background:var(--euc)}
.tl li.lodge .knob{border-color:var(--gold);background:var(--gold)}
.tl li.late .knob{border-color:var(--red)}
.tl .when{font-size:13px;font-weight:700;color:var(--ink-2)}
.tl li.late .when{color:var(--red)}
.tl .what{font-weight:600}
.tl .why{font-size:14px;color:var(--ink-2)}
.field{display:grid;gap:6px;margin:0 0 14px}
.field label{font-weight:600;font-size:14.5px}
.field .hint{font-size:13.5px;color:var(--ink-2)}
.input{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
textarea.input{min-height:90px;resize:vertical}
.input:focus{outline:none;border-color:var(--euc)}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(9,16,28,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.sheet .lead{color:var(--ink-2);margin:0 0 16px}
.sheet h3{font-size:17px;margin:20px 0 8px;font-family:var(--display);font-weight:800}
.sheet p{margin:0 0 10px}
.sheet .close{float:right;margin-left:10px}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:26px;padding:20px 28px 28px}.sheet .grab{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;min-height:42px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.src{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.src.changed{border-color:var(--gold);background:var(--gold-soft)}
.escal{padding:16px;border-radius:18px;background:var(--navy);color:var(--on-navy);margin:16px 0}
.escal p{color:var(--on-navy-2);margin:6px 0 12px;font-size:15px}
.escal strong{font-family:var(--display);font-size:18px}
.issue{padding:12px 14px;border-radius:14px;background:var(--gold-soft);margin:8px 0;font-size:15px}
.issue.red{background:var(--red-soft)}
.issue b{display:block;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .2s ease}
@media(min-width:960px){.toast{bottom:28px}}
.langlist{display:grid;gap:8px}
.langlist button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;text-align:left}
.langlist button[aria-pressed="true"]{border-color:var(--euc);background:var(--euc-soft)}

/* Onboarding */
.ob{max-width:580px;margin:0 auto;padding:16px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.ob-prog{flex:1;height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.ob-prog i{display:block;height:100%;background:var(--euc);border-radius:6px;transition:width .35s ease}
.ob-count{font-weight:700;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ob h1{font-size:clamp(32px,7.5vw,46px);font-weight:800;letter-spacing:-.04em;margin-bottom:10px}
.ob .help{color:var(--ink-2);margin:0 0 22px}
.ob .art{border-radius:26px;overflow:hidden;background:var(--navy);height:230px;position:relative;margin-bottom:26px}
.ob .art svg{position:absolute;inset:0;width:100%;height:100%}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:600;font-size:17px;min-height:60px}
.opt[aria-pressed="true"]{border-color:var(--euc);background:var(--euc-soft)}
.opt .e{font-size:22px}
.opt small{display:block;font-weight:500;color:var(--ink-2);font-size:14px}
.ob-foot{margin-top:auto;padding-top:24px;display:flex;gap:10px}
.countrylist{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-top:10px}
.countrylist button{display:block;width:100%;text-align:left;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;font-weight:500}
.countrylist button[aria-pressed="true"]{background:var(--euc-soft);color:var(--euc);font-weight:700}

/* Pack, tools, practice, legal */
.packsheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:580px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:700;color:var(--ink-2)}
pre.brief{white-space:pre-wrap;font-family:var(--body);font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0}
.page{max-width:1000px;margin:0 auto;padding:16px 20px 72px}
.pagebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 24px}
.toolgrid{display:grid;gap:16px}
@media(min-width:900px){.toolgrid{grid-template-columns:1fr 1fr}}
.feebig{font-family:"Bricolage Grotesque",var(--body);font-size:44px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:800px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi b{display:block;font-family:"Bricolage Grotesque",var(--body);font-size:34px;font-weight:800;letter-spacing:-.03em}
.kpi span{color:var(--ink-2);font-size:14px}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;color:var(--ink)}
@media(min-width:800px){.prow{grid-template-columns:2fr 1.4fr 1.4fr 1fr auto}}
.prow .nm{font-weight:700}.prow .sub{font-size:13.5px;color:var(--ink-2)}
.legal h2{font-size:22px;margin:26px 0 8px;font-weight:800}
.legal p,.legal li{color:var(--ink-2)}
@media print{
  .side,.bnav,.topbar,.noprint,.notice{display:none!important}
  body{background:#fff;color:#000}
  .main{padding:0;max-width:none}
  .packsheet{border:0;padding:0}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

く、移民に関する助言はしません。", "l.dont2": "ビザを選んだり、証拠が十分かどうかを判断したりしません。", "l.dont3": "許可を予測することも、代わりに申請することもありません。", "l.cx": "複雑な場合は", "l.cxp": "専門家が必要な質問もあります。その場合はそうお伝えし、質問の整理を手伝い、公式の移民エージェント登録簿をご案内します。", "l.data": "あなたの書類", "l.datap": "正式公開後：オーストラリア国内で暗号化して保管し、AI の学習には一切使わず、結果が出た後に削除します。このデモでは、何もお使いの端末の外に出ません。", "l.price": "シンプルな料金。解約忘れのサブスクはありません。", "l.priceP": "パスは準備に必要な期間をカバーします。有料パスは正式公開時に開始。ここではすべて無料でお試しいただけます。", "p.free": "無料", "p.forever": "ずっと", "p.free1": "申請者1名", "p.free2": "出典付きの公式チェックリスト全体", "p.solo": "ソロパス", "p.solop": "6か月、申請者1名", "p.solo1": "書類とチェックが無制限", "p.solo2": "スケジュール、パック、エージェント向け概要", "p.fam": "カップル＆ファミリー", "p.famp": "12か月、最大6名", "p.fam1": "パートナーも専用ログイン", "p.fam2": "関係の証拠を共有", "p.prac": "移民事務所向け", "p.pracp": "月額、から", "p.prac1": "顧客向けのブランド版 VisaFly", "p.prac2": "届いた書類と不足書類がひと目でわかる", "p.start": "無料で始める", "p.talk": "事務所ポータルを見る", "p.popular": "カップルに人気", "l.agents": "移民エージェント・弁護士の方へ", "l.agentsP": "顧客に何時間も書類を催促する代わりに、VisaFly を送りましょう。顧客は落ち着いて進められるガイド付きの作業スペースを、あなたは名前付きでチェック済みのファイルを受け取ります。専門的な判断はすべてあなたのものです。", "l.toolsH": "無料ツール", "l.toolsP": "単体でも便利。アカウントは不要です。", "l.faq": "よくある質問", "l.q1": "VisaFly は移民エージェントですか？", "l.a1": "いいえ。VisaFly は書類を整理するソフトウェアです。移民に関する支援ができるのは、登録移民エージェント、オーストラリアの法律実務家、一部の適用除外者のみです。", "l.q2": "パーセンテージが高ければビザは許可されますか？", "l.a2": "いいえ。パーセンテージは整理を終えた項目の割合で、結果とは関係ありません。", "l.q3": "申請を代わりに提出してくれますか？", "l.a3": "いいえ。内務省の公式ウェブサイトにあるご自身の ImmiAccount から申請します。ImmiAccount のパスワードを尋ねることは決してありません。", "l.q4": "データを削除できますか？", "l.a4": "はい。ボタン一つでプラン、メモ、すべてのファイルを削除できます。", "l.footer": "VisaFly はビザ書類を整理するための独立したソフトウェアです。オーストラリア内務省（Department of Home Affairs）およびオーストラリア政府とは関係がなく、登録移民エージェントではなく、移民支援や法的助言は提供しません。公式要件は必ず immi.homeaffairs.gov.au でご確認ください。", "l.checked": "要件の出典の最終確認日：{d}。", "ob.welcome": "書類を整理しましょう", "ob.welcomeP": "5つの簡単な質問のあと、ビザを選びます。約2分です。", "ob.begin": "始める", "ob.langQ": "言語を選んでください", "ob.name": "お名前は？", "ob.nameP": "名前だけで大丈夫です。ほかの人はあとで追加できます。", "ob.nameL": "名前", "ob.loc": "今どこにいますか？", "ob.locP": "ビザによっては、オーストラリア国内または国外からしか申請できません。", "ob.in": "オース <script>
"use strict";
/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const isoOf = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;

const IDB = {db: null};

async function idbTx(mode, fn) { const db = IDB.db || await idbOpen(); if (!db) return null; return new Promise(res => { try { const tx = db.transaction('f', mode); const st = tx.objectStore('f'); const out = fn(st); tx.oncomplete = () => res(out && out.result !== undefined ? out.result : true); tx.onerror = () => res(null); } catch (e) { res(null); } }); }
const idbPut = (id, blob) => idbTx('readwrite', st => st.put(blob, id));

    cloud.ref = db.doc('data/users/' + id + '/plan');
    const snap = await cloud.ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.state && remote.state.items && (remote.savedAt || '') > (state.savedAt || '')) { adopt(remote); closeSheet(); render(); toast(t('sync.pulled')); }
    else if (state.onboarded && (!remote || (state.savedAt || '') > (remote.savedAt || ''))) pushNow();

  const w = 2736, h = 3648, c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.fillStyle = '#b9ad98'; x.fillRect(0, 0, w, h);
  x.save(); x.translate(w / 2, h / 2); x.rotate(-0.035); x.fillStyle = '#f7f3ea'; x.fillRect(-1000, -1400, 2000, 2800);
  x.fillStyle = '#13233A'; x.fillRect(-1000, -1400, 2000, 230); x.fillStyle = '#F1ECE1'; x.font = 'bold 84px sans-serif'; x.fillText('Inner West Energy (fictional)', -920, -1255);
  x.fillStyle = '#13233A'; x.font = 'bold 96px sans-serif'; x.fillText('Electricity bill', -920, -1020);
  x.font = '58px sans-serif'; ['Account: S CHEN & D OKAFOR', 'Supply: 12/48 King St, Newtown NSW', 'Period: 1 Jul - 30 Sep 2026', 'Amount due: $612.40', '', 'SPECIMEN - FICTIONAL - VISAFLY DEMO'].forEach((s, i) => x.fillText(s, -920, -860 + i * 110));
  x.restore();
  const img = x.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 60; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(img, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .98));
  const tc = document.createElement('canvas'); tc.width = 300; tc.height = 400; tc.getContext('2d').drawImage(c, 0, 0, 300, 400);
  return {blob, thumb: tc.toDataURL('image/jpeg', .7)};
}

function buildItems(visa, people) {
  const main = people[0], partner = people.find(p => p.role === 'partner'), items = [];
  Object.entries(REQ).forEach(([id, r]) => {

    if (r.scope === 'couple') { if (PARTNERV.includes(visa) || partner) items.push(makeItem(id, 'both')); return; }

/* ================= Ring ================= */
function ring(size) {
  const items = state.items.filter(i => ['ready', 'attention', 'missing', 'todo'].includes(eff(i)));
  const order = {ready: 0, attention: 1, missing: 2, todo: 3};
  items.sort((a, b) => order[eff(a)] - order[eff(b)]);
  const n = Math.max(items.length, 1), cx = 100, cy = 100, r = 84, seg = 360 / n, gap = Math.min(3.2, seg * .28);
  const pt = a => { const rad = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; };
  const col = {ready: '#7DB19C', attention: '#D8B25A', missing: '#E2876F', todo: '#3A5070'};
  const paths = items.map((it, i) => { const a0 = i * seg + gap / 2, a1 = (i + 1) * seg - gap / 2; const [x0, y0] = pt(a0), [x1, y1] = pt(a1); return `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" stroke="${col[eff(it)]}" stroke-width="15" fill="none"><title>${esc(itemTitle(it))}: ${esc(LABEL(eff(it)))}</title></path>`; }).join('');
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="${tt('h.plan')}">${paths}</svg>`;
}

  const extra = [['map', 'nav.map', 'map'], ['pack', 'nav.pack', 'pack'], ['brief', 'nav.brief', 'brief']].map(([r, k, i]) => `<a class="nav" href="#/${r}" ${active === r ? 'aria-current="page"' : ''}>${ICON[i]}<span>${tt(k)}</span></a>`).join('');
  return `<div class="app">
  <aside class="side" aria-label="Main">
    <a class="logo" href="#/home" style="margin-bottom:18px">${LOGO}VisaFly</a>
    ${nav('nav')}<div class="sep"></div>${extra}<div class="sep"></div>
    <a class="nav" href="#/tools">${ICON.tools}<span>${tt('nav.tools')}</span></a>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" data-act="copilot">${ICON.ask}${tt('ask')}</button>
    <p style="font-size:12.5px;color:var(--ink-2);margin:10px 4px 0">${tt('trust.short')}</p>
  </aside>
  <main class="main" id="main">
    <div class="topbar"><a class="logo" href="#/home">${LOGO}VisaFly</a><div style="display:flex;gap:8px;margin-left:auto">${langBtn()}<button class="iconbtn" data-act="copilot" aria-label="${tt('ask')}">${ICON.ask}</button></div></div>
    ${body}
  </main>
  <nav class="bnav" aria-label="Main">${nav('')}</nav></div>`;
}
let lastRoute = null, lastStep = null;
function render() {
  const r = route(), appR = ['home', 'checklist', 'documents', 'timeline', 'profile', 'map', 'pack', 'brief'];
  if (appR.includes(r) && !state.onboarded) { location.hash = '#/'; return; }
  const V = {home: viewHome, checklist: viewChecklist, documents: viewDocs, timeline: viewTimeline, profile: viewProfile, map: viewMap, pack: viewPack, brief: viewBrief};
  let html;
  if (V[r]) html = shell(r, V[r]());
  else if (r === 'start') html = viewOnboard();
  else if (r === 'tools') html = viewTools();
  else if (r === 'practice') html = viewPractice();
  else if (r === 'legal') html = viewLegal();
  else html = viewLanding();
  $('#root').innerHTML = html;
  if (r === 'documents') wireDrop();
  if (r === 'start' && lastStep !== ob.step) { const f = $('#cq') || $('#obname'); if (f) f.focus(); }
  if (r !== lastRoute || (r === 'start' && lastStep !== ob.step)) window.scrollTo(0, 0);
  lastRoute = r; lastStep = ob.step;
}
window.addEventListener('hashchange', () => { closeSheet(); render(); });

function finishOnboarding() {
  const a = ob.a, first = a.first.trim();
  const people = [{id: 'p1', name: first, first, role: 'main', passportName: ''}];
  if (a.who === 'partner' || a.who === 'family') people.push({id: 'p2', name: t('role.partner'), first: t('role.partner'), role: 'partner', passportName: ''});
  const months = {asap: 1, '1': 2, '3': 4, r: 6}[a.timing] || 3;
  state = blank(); state.onboarded = true;
  state.profile = {first, location: a.location, passport: a.passport, goal: a.goal, who: a.who, timing: a.timing, visa: a.visa, target: addMonths(TODAY, months)};
  state.people = people; state.items = buildItems(a.visa, people); save();
  ob = {step: 0, a: {}}; go('home');
  setTimeout(() => toast(a.who === 'family' ? t('ob.family') : t('ob.ready')), 250);
}

function timelineTasks() {
  const target = state.profile.target;
  const tasks = outstanding().filter(i => i.req !== 'adm.review').map(it => { const r = REQ[it.req]; return {date: addDays(target, -Math.max(r.lead, 7)), what: itemTitle(it), who: personName(it.person), why: r.lead >= 30 ? t('t.slow') : LABEL(eff(it)), id: it.id}; });
  const rv = state.items.find(i => i.req === 'adm.review');
  if (!rv || eff(rv) !== 'ready') tasks.push({date: addDays(target, -7), what: t('t.final'), who: t('everyone'), why: t('t.finalW'), id: rv && rv.id});
  return tasks.sort((a, b) => a.date.localeCompare(b.date));

let listFilter = {person: 'all', status: 'all'};
function viewChecklist() {
  const ppl = [['all', t('everyone')]].concat(state.people.map(p => [p.id, p.first])).concat(state.people.length > 1 ? [['both', t('c.shared')]] : []);
  const sts = [['all', t('c.all')], ['attention', LABEL('attention')], ['missing', LABEL('missing')], ['todo', LABEL('todo')], ['ready', LABEL('ready')]];
  const match = it => (listFilter.person === 'all' || it.person === listFilter.person) && (listFilter.status === 'all' || eff(it) === listFilter.status);

  <h2>What we collect</h2><p>The answers you give, the people you add, your notes, and the documents you upload. Documents can contain sensitive information such as identity, health and criminal record details, so we collect only what you choose to add and handle it as sensitive.</p>
  <h2>Where it is stored</h2><p>At launch: in Australia, encrypted in transit and at rest, with per-account keys. In this prototype, your plan is stored in your own browser and files stay in the open tab only.</p>
  <h2>Automated suggestions</h2><p>VisaFly may suggest a document type from a file name or its contents. Every suggestion is shown to you and you confirm it. Nothing is filed silently, and no decision about you is made automatically.</p>
  <h2>Who processes it</h2><p>We will name every service provider that processes your data in this policy before launch. Document-reading providers will be contracted not to keep or train on your documents.</p>
  <h2>Keeping and deleting</h2><p>You choose how long we keep your documents. By default they are deleted 90 days after you mark a decision received. “Delete everything” removes your plan and files immediately and backups within 30 days.</p>
  <h2>Your rights</h2><p>You can download your data, correct it or delete it at any time. If you have a privacy complaint you can contact us, and if you are not satisfied you can contact the <a href="${SRC.oaic.url}" target="_blank" rel="noopener">${esc(SRC.oaic.label)}</a>.</p>
  <h2>Getting migration advice</h2><p>For advice about your situation, use a <a href="${SRC.omara.url}" target="_blank" rel="noopener">registered migration agent</a> or an Australian legal practitioner. See also <a href="${SRC.whoCanHelp.url}" target="_blank" rel="noopener">${esc(SRC.whoCanHelp.label)}</a>.</p></div>`;

  if (on === 'change-visa') {
    const nv = tg.value, old = state.items, fresh = buildItems(nv, state.people); state.profile.visa = nv;
    fresh.forEach(f => { const m = old.find(o => o.req === f.req && o.person === f.person && !(o.meta && o.meta.country)); if (m) Object.assign(f, {status: m.status, note: m.note, meta: m.meta, question: m.question}); });
    if (fresh.some(f => f.req === 'char.police')) old.filter(o => o.req === 'char.police' && o.meta && o.meta.country).forEach(o => { const f = fresh.find(x => x.req === 'char.police' && x.person === o.person && !x.meta.country); if (f) Object.assign(f, {status: o.status, meta: o.meta, note: o.note}); else fresh.push(Object.assign(makeItem('char.police', o.person), {status: o.status, meta: o.meta, note: o.note})); });
    state.docs.forEach(d => { d.item = null; const f = fresh.find(x => x.req === d.kind && (x.person === d.person || x.person === 'both') && (d.kind !== 'char.police' || !x.docs.length)); if (f) { f.docs.push(d.id); d.item = f.id; } });
    state.items = fresh; save(); render(); toast(t('pr.rebuilt'));
  }
});

/* ================= Boot ================= */
try { const th = localStorage.getItem('visafly.theme'); if (th && th !== 'auto') document.documentElement.dataset.theme = th; } catch (e) {}
try { const m = {name: 'VisaFly', short_name: 'VisaFly', display: 'standalone', background_color: '#F1ECE1', theme_color: '#13233A', start_url: '.'}; const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type: 'application/manifest+json'})); document.head.appendChild(l); } catch (e) {}
render();
if (state.demo) ensureBigPhoto();
idbLoadAll().then(n => { if (n) render(); });
initCloud();
downloads();
</script>
